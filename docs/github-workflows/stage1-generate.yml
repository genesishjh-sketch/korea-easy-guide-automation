name: Stage 1 Generate Article

on:
  workflow_dispatch:
    inputs:
      seed:
        description: "Topic seed keyword"
        required: false
        default: "incheon airport to seoul"
  schedule:
    - cron: "0 22 * * *"

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      APP_ENV: production
      SITE_NAME: ${{ vars.SITE_NAME || 'Korea Easy Guide' }}
      SITE_URL: ${{ vars.SITE_URL || 'https://koreaeasyguide.blogspot.com' }}
      DEFAULT_AUTHOR: ${{ vars.DEFAULT_AUTHOR || 'Korea Easy Guide Editorial Team' }}
      REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
      REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
      REDDIT_USER_AGENT: ${{ vars.REDDIT_USER_AGENT || 'korea-easy-guide/0.1' }}
      GOOGLE_SEARCH_PROVIDER: suggest
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run safety regression tests
        run: python -m unittest discover -v
      - name: Generate article
        run: |
          SEED="${{ github.event.inputs.seed }}"
          if [ -z "$SEED" ]; then SEED="incheon airport to seoul"; fi
          python -m src.pipeline.stage1_generate --seed "$SEED"
      - name: Upload generated article
        uses: actions/upload-artifact@v6
        with:
          name: generated-article
          path: data/generated/
