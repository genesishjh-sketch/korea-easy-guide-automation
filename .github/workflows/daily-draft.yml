name: Korea Daily Validate / Manual Publish

on:
  workflow_dispatch:
    inputs:
      seed:
        description: "Optional topic seed"
        required: false
      mode:
        description: "validate, draft, or publish"
        required: false
        default: "validate"
  schedule:
    # 09:40 KST GitHub validation fallback. Codex local owns scheduled publishing.
    - cron: "40 0 * * *"
    # 09:55 KST validation retry. Scheduled GitHub runs never insert Blogger posts.
    - cron: "55 0 * * *"

concurrency:
  group: korea-easy-guide-daily-publish
  cancel-in-progress: false

jobs:
  daily-draft:
    runs-on: ubuntu-latest
    env:
      APP_ENV: production
      SITE_NAME: ${{ vars.SITE_NAME || 'Korea Easy Guide' }}
      SITE_URL: ${{ vars.SITE_URL || 'https://koreaeasyguide.blogspot.com' }}
      DEFAULT_AUTHOR: ${{ vars.DEFAULT_AUTHOR || 'Guide Studio' }}
      BLOGGER_BLOG_ID: ${{ vars.BLOGGER_BLOG_ID || '288143591612645486' }}
      GOOGLE_OAUTH_CLIENT_SECRET_FILE: .credentials/client_secret.json
      GOOGLE_OAUTH_TOKEN_FILE: .credentials/google_token.json
      BLOGGER_PUBLISH_MODE: ${{ github.event.inputs.mode || 'validate' }}
      DAILY_BATCH_MAX_POSTS: ${{ vars.KOREA_EASY_GUIDE_DAILY_BATCH_MAX_POSTS || '1' }}
      REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
      REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
      REDDIT_USER_AGENT: ${{ vars.REDDIT_USER_AGENT || 'korea-easy-guide/0.1' }}
      GOOGLE_SEARCH_PROVIDER: suggest
      NOTIFICATION_PROVIDER: ${{ vars.NOTIFICATION_PROVIDER }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run safety regression tests
        run: python -m unittest discover -v
      - name: Write Google OAuth files
        run: |
          mkdir -p .credentials
          printf '%s' '${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET_JSON }}' > .credentials/client_secret.json
          printf '%s' '${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}' > .credentials/google_token.json
          printf '%s' '${{ secrets.GOOGLE_OAUTH_TOKEN_SEARCH_CONSOLE_JSON }}' > .credentials/google_token.search-console.json
      - name: Run daily draft pipeline
        id: publish_pipeline
        run: |
          if [ -n "${{ github.event.inputs.seed }}" ]; then
            python -m src.pipeline.daily_draft --mode "${BLOGGER_PUBLISH_MODE}" --seed "${{ github.event.inputs.seed }}"
          elif [ "${BLOGGER_PUBLISH_MODE}" = "publish" ]; then
            python -m src.pipeline.daily_batch --mode publish --max-posts "${DAILY_BATCH_MAX_POSTS}"
          else
            python -m src.pipeline.daily_draft --mode "${BLOGGER_PUBLISH_MODE}"
          fi
      - name: Submit sitemap
        if: ${{ success() && steps.publish_pipeline.outputs.new_publication == 'true' }}
        run: python -m src.pipeline.stage3_submit_sitemap --strict
      - name: Audit latest URL indexability
        if: ${{ success() && steps.publish_pipeline.outputs.new_publication == 'true' }}
        run: python -m src.pipeline.stage3_search_console_audit --site korea_easy_guide --inspection-count 5 --strict
      - name: Build AdSense readiness and repurpose drafts
        if: ${{ success() && steps.publish_pipeline.outputs.new_publication == 'true' }}
        run: |
          python -m src.pipeline.stage6_adsense_readiness --site korea_easy_guide
          python -m src.pipeline.stage6_repurpose_content --site korea_easy_guide --latest
      - name: Check daily publication count
        if: ${{ !cancelled() && env.BLOGGER_PUBLISH_MODE == 'publish' }}
        run: python -m src.pipeline.stage4_missing_publish_alert --site korea_easy_guide --minimum-posts "${DAILY_BATCH_MAX_POSTS}"
      - name: Upload generated outputs
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: daily-draft-output
          path: |
            data/generated/
            data/repurpose/
            reports/
