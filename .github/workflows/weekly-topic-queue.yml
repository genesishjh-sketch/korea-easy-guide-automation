name: Weekly Topic Queue Validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-topic-queue
  cancel-in-progress: false

jobs:
  weekly-topic-queue:
    runs-on: ubuntu-latest
    env:
      APP_ENV: production
      BLOGGER_PUBLISH_MODE: validate
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run queue regression tests
        run: python -m unittest tests.test_weekly_queue tests.test_daily_batch
      - name: Validate topic registry freshness and invariants
        shell: bash
        run: |
          validate_registry() {
            local site="$1"
            set +e
            python -m src.pipeline.topic_board validate --site "${site}" --max-run-age-hours 192
            local status=$?
            set -e
            if [ "${status}" -eq 0 ]; then
              return 0
            fi
            if [ "${status}" -eq 2 ]; then
              echo "::warning::${site} registry rollout/freshness gate is not ready; local controller must use explicit legacy fallback."
              return 0
            fi
            echo "::error::${site} registry validation failed with exit ${status}."
            return "${status}"
          }
          validate_registry korea_easy_guide
          validate_registry easy_pc_fix_guide
      - name: Validate committed queue provenance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for site in ("korea_easy_guide", "easy_pc_fix_guide"):
              paths = sorted(Path("data/plans").glob(f"{site}_weekly_queue_*.json"))
              if not paths:
                  print(f"::warning::{site}: committed weekly queue file is missing")
                  continue
              queue = json.loads(paths[-1].read_text(encoding="utf-8"))
              status = queue.get("status")
              if status not in {"approved", "DEGRADED", "SHADOW"}:
                  raise SystemExit(f"{site}: unsupported queue status {status!r}")
              if status == "DEGRADED":
                  selection = queue.get("topic_selection") or {}
                  if not queue.get("fallback_reason"):
                      raise SystemExit(f"{site}: DEGRADED queue is missing fallback_reason")
                  if selection.get("fallback_source") not in {"legacy", ""}:
                      raise SystemExit(f"{site}: DEGRADED queue has invalid fallback_source")
              for item in queue.get("items") or []:
                  if item.get("topic_source") == "registry" and item.get("registry_status") not in {
                      "READY",
                      "SCHEDULED",
                  }:
                      raise SystemExit(
                          f"{site}: registry queue item is not READY/SCHEDULED: {item.get('topic_id')}"
                      )
                  if item.get("topic_source") == "registry" and not queue.get("research_run_id"):
                      raise SystemExit(f"{site}: registry queue is missing research_run_id")
          PY
