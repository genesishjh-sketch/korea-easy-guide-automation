name: Easy PC Fix Weekly Report

on:
  workflow_dispatch:
  schedule:
    # 09:40 KST every Monday.
    - cron: "40 0 * * 1"

jobs:
  weekly-report:
    runs-on: ubuntu-latest
    env:
      APP_ENV: production
      SITE_KEY: easy_pc_fix_guide
      EASY_PC_FIX_GUIDE_BLOGGER_BLOG_ID: ${{ vars.EASY_PC_FIX_GUIDE_BLOGGER_BLOG_ID }}
      EASY_PC_FIX_GUIDE_SITE_URL: ${{ vars.EASY_PC_FIX_GUIDE_SITE_URL || 'https://easypcfixguide.blogspot.com' }}
      EASY_PC_FIX_GUIDE_SEARCH_CONSOLE_SITE_URL: ${{ vars.EASY_PC_FIX_GUIDE_SEARCH_CONSOLE_SITE_URL || 'https://easypcfixguide.blogspot.com/' }}
      EASY_PC_FIX_GUIDE_GA4_MEASUREMENT_ID: ${{ vars.EASY_PC_FIX_GUIDE_GA4_MEASUREMENT_ID }}
      EASY_PC_FIX_GUIDE_GA4_PROPERTY_ID: ${{ vars.EASY_PC_FIX_GUIDE_GA4_PROPERTY_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET_FILE: .credentials/client_secret.json
      GOOGLE_OAUTH_TOKEN_FILE: .credentials/google_token.json
      NOTIFICATION_PROVIDER: ${{ vars.NOTIFICATION_PROVIDER }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
      REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
      EASY_PC_FIX_GUIDE_REDDIT_USER_AGENT: ${{ vars.EASY_PC_FIX_GUIDE_REDDIT_USER_AGENT || 'easy-pc-fix-guide/0.1 by posting-automation-alert-bot' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Write Google OAuth files
        run: |
          mkdir -p .credentials
          printf '%s' '${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET_JSON }}' > .credentials/client_secret.json
          printf '%s' '${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}' > .credentials/google_token.json
          printf '%s' '${{ secrets.GOOGLE_OAUTH_TOKEN_SEARCH_CONSOLE_JSON }}' > .credentials/google_token.search-console.json
          printf '%s' '${{ secrets.GOOGLE_OAUTH_TOKEN_ANALYTICS_JSON }}' > .credentials/google_token.analytics.json
      - name: Run Reddit OAuth health check for weekly context
        continue-on-error: true
        run: python -m src.pipeline.stage0_reddit_health --site easy_pc_fix_guide
      - name: Generate and send weekly report
        run: python -m src.pipeline.stage3_weekly_report --site easy_pc_fix_guide
      - name: Upload weekly report
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: easy-pc-fix-weekly-report
          path: |
            reports/easy_pc_fix_guide-reddit-health.json
            reports/easy_pc_fix_guide-reddit-health.md
            reports/easy_pc_fix_guide-weekly-*
            reports/easy_pc_fix_guide-weekly-failure.json
